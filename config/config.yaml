# overrides by the content type slug. The route-name key takes precedence; if it is
# absent, the content type slug of the listing is used as a fallback.
#
# Per-locale values can be nested under `locales:` (keyed by locale). They are merged
# over the base values for the current request locale, so any field you omit for a
# locale falls back to the base. This works for any override key.
